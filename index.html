<style>
:root{--bg:#F3F4F7;--surface:#FFFFFF;--ink:#171A28;--muted:#4D536A;--line:#D7DAE3;--accent:#2D3C9B;--accent-ink:#FFFFFF;--hot:#AF352E;--logo:#223150;--tile:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#11131B;--surface:#191C27;--ink:#E9EBF3;--muted:#A9AFC5;--line:#2F3445;--accent:#95A2FF;--accent-ink:#10121A;--hot:#F27D72;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px 24px;width:100%;max-width:390px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.icon{flex:none;width:48px;height:48px;border-radius:22.5%;background:var(--tile);color:var(--logo);display:grid;place-items:center;box-shadow:0 0 0 1px rgba(20,26,50,.10),0 1px 2px rgba(20,26,50,.12),0 4px 12px rgba(20,26,50,.10)}
.icon svg{width:80%;height:auto;display:block}
h1{font:750 28px/1.05 "Archivo","Arial Narrow",system-ui,sans-serif;font-stretch:118%;margin:0;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--muted);margin:2px 0 0}
p{margin:0 0 16px;color:var(--muted);font-size:15px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:18px;letter-spacing:.12em;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:600;padding:8px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--hot);font-size:14px;min-height:21px;margin:10px 0 0}
</style>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(code){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
  return await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();}
const f=document.getElementById('f'),inp=document.getElementById('code'),err=document.getElementById('err'),go=document.getElementById('go');
const norm=s=>s.trim().toUpperCase();
async function tryCode(code,remember){go.disabled=true;err.textContent='Checking…';
  try{const html=await unlock(code);if(remember){try{sessionStorage.setItem('gallup-code',code);}catch(e){}}document.open();document.write(html);document.close();}
  catch(e){if(!remember){try{sessionStorage.removeItem('gallup-code');}catch(x){}}err.textContent=e&&e.name==='OperationError'?'That code is not right. Try again.':'This browser could not open Gallup. Try an up-to-date Chrome, Edge, Safari or Firefox.';go.disabled=false;inp.focus();inp.select();}}
f.addEventListener('submit',ev=>{ev.preventDefault();const c=norm(inp.value);if(c)tryCode(c,true);});
if(!window.crypto||!crypto.subtle||typeof DecompressionStream==='undefined'){err.textContent='Open this page in an up-to-date browser over https.';go.disabled=true;}
else{let c=null;try{c=sessionStorage.getItem('gallup-code');}catch(e){}if(c)tryCode(c,false);}
